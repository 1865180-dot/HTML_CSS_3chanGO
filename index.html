<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="さんちゃんと進む HTML・CSS ステージ攻略ゲーム。コードを書きかえてゴールをめざそう。">
<title>コードで進め！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&family=BIZ+UDGothic:wght@400;700&display=swap">
<style>
html,body{margin:0}
img{max-width:100%}
/* レイアウト：上にステージ帯、左にゲーム画面とミッション、右にコードエディタ（狭い画面では縦積み） */
:root{
  --ink:#0f1533; --panel:#171f47; --panel2:#1f2a5c; --line:#2f3c7c;
  --text:#eef1ff; --muted:#a6b0dc; --coin:#ffcc33; --go:#3ee08f; --danger:#ff6b81;
  --sky:#8fd3ff;
  --f-display:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"BIZ UDGothic","Source Code Pro",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font:15px/1.7 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,.vp:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
code{font-family:var(--f-mono);font-size:.92em;background:var(--panel2);padding:1px 5px;border-radius:4px;color:#ffe08a}

/* ヘッダー */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:12px}
.logo{font:28px/1 var(--f-display);margin:0;letter-spacing:.04em;color:var(--coin);text-shadow:3px 3px 0 #b5481f}
.logo small{display:block;font:12px/1.4 var(--f-body);color:var(--muted);text-shadow:none;letter-spacing:.08em;margin-top:6px}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stg{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:4px 10px;font:14px/1.3 var(--f-display);display:flex;flex-direction:column;align-items:center;min-width:64px}
.stg span{font-size:11px;color:var(--muted)}
.stg.on{border-color:var(--coin);background:var(--panel2)}
.stg.cleared span{color:var(--go)}
.hr{align-self:center;font:12px/1.2 var(--f-display);color:var(--coin);border:1px solid var(--line);border-radius:4px;padding:3px 6px;writing-mode:horizontal-tb}
.hr + .stg{margin-left:-2px}
.hr:not(:first-child){margin-left:10px}
.score{margin-left:auto;display:flex;gap:16px;font:15px/1.3 var(--f-display);font-variant-numeric:tabular-nums}
.score b{color:var(--coin);font-weight:400}

/* 本体 */
.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}.score{margin-left:0}}
.game-col,.editor-col{min-width:0;display:flex;flex-direction:column;gap:10px}

/* ゲーム画面 */
.vp{position:relative;width:100%;overflow:hidden;border-radius:10px;border:3px solid #000;background:#000;box-shadow:0 0 0 2px var(--line)}
.vp-inner{position:absolute;left:0;top:0;width:640px;height:360px;transform-origin:0 0;overflow:hidden}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;gap:8px;padding:8px 10px;font:14px/1.2 var(--f-display);color:#fff;text-shadow:2px 2px 0 #000;pointer-events:none;font-variant-numeric:tabular-nums}
.hud .r{text-align:right}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgb(10 14 40 / .88);border:2px solid var(--coin);color:#fff;padding:6px 14px;border-radius:8px;font:14px/1.4 var(--f-display);max-width:90%;text-align:center;pointer-events:none}
.focus-hint{position:absolute;inset:auto 0 0 0;margin:auto;top:0;height:max-content;width:max-content;max-width:90%;background:rgb(0 0 0 / .62);color:#fff;font:15px/1.4 var(--f-display);padding:8px 14px;border-radius:8px;pointer-events:none}
.clear{position:absolute;inset:0;display:grid;place-items:center;background:rgb(8 12 36 / .78);padding:12px}
.clear-card{background:var(--panel);border:3px solid var(--coin);border-radius:12px;padding:16px 22px;text-align:center;max-width:440px;width:100%}
.clear-card h2{font:26px/1.2 var(--f-display);color:var(--coin);margin:0 0 8px}
.clear-card p{margin:4px 0}
.clear-card .t{font:22px/1.3 var(--f-display);font-variant-numeric:tabular-nums}
.clear-card .new{color:var(--go);font-family:var(--f-display)}
.clear-card .msg{font-size:13px;color:var(--muted);margin-top:8px}
.clear-btns{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}

.btn{border:2px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 14px;font-weight:700}
.btn.main-btn{background:var(--go);border-color:#1d9e5f;color:#062615;font-size:16px;padding:8px 18px}
.btn.warn{border-color:var(--danger);color:var(--danger)}
.btn:hover{filter:brightness(1.12)}

.pad{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pad .btn{min-width:56px;min-height:44px;touch-action:none;user-select:none;-webkit-user-select:none}
.pad .sp{flex:1}
.pad .keys{font-size:12px;color:var(--muted)}

/* ミッション */
.mission{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:14px 16px}
.mission h2{font:20px/1.3 var(--f-display);margin:0 0 4px;color:var(--coin);text-wrap:balance}
.mission .lead{margin:0 0 10px;color:var(--muted)}
.mission ol,.mission ul{margin:0;padding-left:1.3em;display:grid;gap:10px}
.mission li::marker{color:var(--coin);font-family:var(--f-display)}
.mission li.done{color:var(--muted)}
.mission li.done strong::after{content:" ✓ できた！";color:var(--go);font-family:var(--f-display)}
.mission details{margin-top:6px;background:var(--panel2);border-radius:8px;padding:4px 10px}
.mission summary{cursor:pointer;color:#ffe08a;font-weight:700}
.mission .gemline{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.snip{display:flex;align-items:center;gap:8px;margin:6px 0;background:#0b1029;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.snip code{background:none;padding:0;flex:1;min-width:0;overflow-x:auto;white-space:pre;color:#d9e1ff}
.snip .btn{padding:2px 10px;font-size:13px;flex-shrink:0}
.memo{font-size:13px;color:var(--muted);margin:10px 0 0}
.explain{margin-top:14px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.explain h3{margin:0 0 4px;font:17px/1.4 var(--f-display);font-weight:400;color:var(--coin)}
.explain p{margin:4px 0}
.pair{display:grid;gap:6px;margin:8px 0}
.pair div{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:2px 10px;align-items:baseline;background:#0b1029;border-radius:6px;padding:6px 10px}
.pair b{font:13px/1.4 var(--f-display);font-weight:400;color:var(--muted)}
.pair code{background:none;padding:0;color:#d9e1ff;overflow-x:auto;white-space:pre}
.pair code mark{background:rgb(255 204 51 / .25);color:#ffe08a;border-radius:3px;padding:0 2px}
.pair span{grid-column:2;font-size:13px;color:var(--muted)}
.mission ul.names{display:flex;flex-wrap:wrap;gap:6px 18px;margin:6px 0 0;padding:0;list-style:none}
.mission details.memo-box{margin-top:12px}
.memo-box dl{margin:6px 0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 12px}
.memo-box dt{font-weight:700;color:#ffe08a}
.memo-box dd{margin:0}
@media (max-width:520px){.memo-box dl{grid-template-columns:minmax(0,1fr)}}

/* エディタ */
.tabs{display:flex;gap:4px;align-items:flex-end}
.tab{border:2px solid var(--line);border-bottom:none;background:var(--panel);border-radius:8px 8px 0 0;padding:6px 18px;font:15px/1.2 var(--f-display);color:var(--muted)}
.tab.on{background:#0b1029;color:var(--coin)}
.tabs .note{margin-left:auto;font-size:12px;color:var(--muted);padding-bottom:4px}
.code{position:relative;height:clamp(360px,64vh,680px);background:#0b1029;border:2px solid var(--line);border-radius:0 8px 8px 8px;overflow:hidden;margin-top:-10px}
.code pre,.code textarea{position:absolute;inset:0;margin:0;padding:14px;font:14px/1.65 var(--f-mono);tab-size:2;white-space:pre;overflow-wrap:normal;letter-spacing:0;border:0}
.code pre{overflow:hidden;color:#d9e1ff;pointer-events:none}
.code textarea{background:transparent;color:transparent;caret-color:#fff;resize:none;overflow:auto;outline:none}
.code textarea::selection{background:rgb(255 204 51 / .35);color:transparent}
.t-com{color:#7ee2a0;font-style:normal}
.t-tag{color:#ff9fbf}.t-attr{color:#ffd166}.t-str{color:#8fd3ff}
.t-sel{color:#ff9fbf}.t-prop{color:#ffd166}.t-val{color:#8fd3ff}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.credit{font-size:12px;color:var(--muted);margin:0}
.mission summary.nudge{outline:2px solid var(--coin);border-radius:6px;padding:0 6px;animation:nudge .8s ease-in-out infinite alternate}
@keyframes nudge{to{background:rgb(255 204 51 / .28)}}
.lint{background:#2a2110;border:2px solid var(--coin);border-radius:8px;padding:8px 12px}
.lint h3{margin:0 0 4px;font:15px/1.4 var(--f-display);color:var(--coin);font-weight:400}
.lint ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.lint p{margin:6px 0 0;font-size:12px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== ゲームの世界（生徒のCSSが上書きできるよう :where で優先度0にしている） ===== */
:where(.world){position:absolute;left:0;top:0;height:360px;background:var(--sky);overflow:hidden;font-family:var(--f-body)}
:where(.world.dark){background:#0b0f1f}
:where(#sys,#layer){position:absolute;inset:0}
:where(#sys) > *{position:absolute}
:where(#layer) > *{position:absolute;margin:0}
:where(.sys-ground){background:linear-gradient(#5cc85c 0 10px,#3a9c45 10px 14px,#8a5a2b 14px);box-shadow:inset 0 -6px rgb(0 0 0 / .15)}
:where(.dark .sys-ground){background:linear-gradient(#2f6a4a 0 10px,#244c3a 10px 14px,#3b2a1c 14px)}
:where(.sys-wall){background:#b55b33;background-image:linear-gradient(#7b3519 2px,transparent 2px),linear-gradient(90deg,#7b3519 2px,transparent 2px);background-size:40px 20px;box-shadow:inset 0 0 0 2px #7b3519}
:where(.sys-flag){width:8px;height:140px;background:#e9edf5;border-radius:4px 4px 0 0}
:where(.sys-flag)::before{content:"";position:absolute;left:8px;top:6px;width:44px;height:30px;background:var(--go);clip-path:polygon(0 0,100% 50%,0 100%)}
:where(.sys-flag)::after{content:"";position:absolute;left:-4px;top:-10px;width:16px;height:16px;border-radius:50%;background:var(--coin)}
:where(.sys-sign){background:#fff8e6;color:#3b2a1c;border:3px solid #8a5a2b;border-radius:6px;padding:4px 8px;font:13px/1.35 var(--f-display);white-space:pre;box-shadow:0 3px 0 rgb(0 0 0 / .2)}
:where(.sys-cloud){width:70px;height:22px;background:#fff;border-radius:20px;opacity:.85}
:where(.sys-cloud)::before{content:"";position:absolute;left:14px;top:-12px;width:34px;height:28px;border-radius:50%;background:#fff}
:where(.sys-star){width:3px;height:3px;background:#fff;border-radius:50%;opacity:.7}

<script>
(() => {
const H = 360, VW = 640, G = 0.6, MAXFALL = 14;
const DEF = { jump: 10, speed: 4, color: 'rgb(248, 223, 130)' };
const LIM = { jump: [5, 16], speed: [1, 6], size: [12, 64] };

const PLAYER_CSS = `/* 主人公「さんちゃん」 */
#player {
  --jump-power: 10;  /* ジャンプ力（5〜16） */
  --speed: 4;        /* はやさ（1〜6） */
  width: 28px;
  height: 44px;
  background-color: #f8df82;
}
`;
const BLOCK_CSS = `
/* 足場 */
.block {
  width: 64px;
  height: 24px;
  background-color: #c9853f;
}
`;

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const snip = c => `<div class="snip"><code>${esc(c)}</code><button class="btn copy" type="button">コピー</button></div>`;

const GLOSS = `<details class="memo-box"><summary>ことばメモ（class・タグ・CSSの読み方）</summary>
<dl>
<dt>タグ</dt><dd><code>&lt;div&gt;</code> から <code>&lt;/div&gt;</code> までが、1つの部品です。</dd>
<dt>class</dt><dd>部品につける「種類の名前」。HTMLでは <code>class="block"</code>、CSSでは <code>.block</code> と書きます。名前が1文字でもちがうと、別の種類としてあつかわれます。スペースで区切ると、1つの部品に名前を2つ以上つけられます（例 <code>class="block big"</code>）。</dd>
<dt>id</dt><dd><code>#player</code> のように <code>#</code> がつくのは、1つだけの部品につける名前です。</dd>
<dt>style</dt><dd>その部品だけに直接書くCSS。このゲームでは、場所（<code>left</code>＝左から、<code>bottom</code>＝下から）を決めるのに使っています。</dd>
<dt>CSSの形</dt><dd><code>.block { width: 64px; }</code> は「だれの（<code>.block</code>）」「何を（<code>width</code>）」「どうする（<code>64px</code>）」の順です。1行の終わりには <code>;</code> をつけます。</dd>
<dt>コメント</dt><dd>HTMLは <code>&lt;!-- --&gt;</code>、CSSは <code>/* */</code> の中がコメント。ゲームには出てこない、人が読むためのメモです。</dd>
</dl></details>`;

const STAGES = [
{ name:'チュートリアル', W:1280, dark:false, tab:'html',
  solids:[[0,0,380,60,'g'],[380,0,380,170,'g'],[760,0,240,320,'g'],[1000,0,280,60,'g']],
  goal:1200,
  signs:[[150,200,'高くて登れない…\n足場を置こう！（A）'],[520,220,'ジャンプ力を\n上げよう！（B）'],[1040,130,'ゴールは\nすぐそこ！']],
  html:`<!-- ===== ステージ0：チュートリアル ===== -->
<!-- 制作者より：コードの中の「コメント」には、
     ヒントや秘密がかくれていることがあるよ。 -->

<!-- 宝石（ふれるとゲット！） -->
<div class="gem" style="left: 860px; bottom: 340px;"></div>

<!-- ↓ ミッションA：ここに足場のコードを貼り付けよう -->

`,
  css: PLAYER_CSS + BLOCK_CSS,
  mission:`<h2>ステージ0　チュートリアル</h2>
<p class="lead">主人公は三筑中のキャラクター「さんちゃん」。コードを書きかえると、ゲームの世界が変わります。3つの操作をためそう。</p>
<ol>
<li data-check="A"><strong>足場を置こう（HTML）</strong><br>下のコードをコピーして、HTMLの「ここに足場のコードを貼り付けよう」の下に貼り付け、<b>反映して遊ぶ</b>をおそう。
${snip('<div class="block" style="left: 300px; bottom: 90px;"></div>')}
<span class="memo"><code>left</code> は左からの距離、<code>bottom</code> は下からの高さです（単位 px）。</span></li>
<li data-check="B"><strong>ジャンプ力を上げよう（CSS）</strong><br>CSSタブを開き、<code>--jump-power: 10;</code> の数字を <code>15</code> に変えて反映。高い壁をこえられます。</li>
<li data-check="C"><strong>さんちゃんを自分の色にしよう（CSS）</strong><br><code>#player</code> の <code>background-color</code> を好きな色に。<code>#3fa7ff</code> や <code>hotpink</code> のように書くと、体の色が変わります。</li>
</ol>
<div class="explain">
<h3>class（クラス）ってなに？</h3>
<p><code>class</code> は、部品につける<b>「種類の名前」</b>です。HTMLで名前をつけ、CSSでその名前の部品の見た目を決めます。</p>
<div class="pair">
<div><b>HTML</b><code>&lt;div <mark>class="block"</mark> style="…"&gt;&lt;/div&gt;</code><span>「この部品は block（足場）です」と名前をつける</span></div>
<div><b>CSS</b><code><mark>.block</mark> { background-color: #c9853f; }</code><span>「block という名前の部品は、全部この色」と決める。CSSでは名前の前に <code>.</code>（ドット）をつける</span></div>
</div>
<p>同じ class の部品は、CSSを1か所変えるだけで全部いっしょに変わります。このゲームでは、class の名前で部品の役割も決まります。</p>

function lintCSS(src){
  const w=[];
  if((src.match(/\/\*/g)||[]).length>(src.match(/\*\//g)||[]).length) w.push('コメントの <code>/*</code> が <code>*/</code> で閉じられていません。');
  const body=src.replace(/\/\*[\s\S]*?(\*\/|$)/g,'');
  const o=(body.match(/{/g)||[]).length, c=(body.match(/}/g)||[]).length;
  if(o!==c) w.push(`<code>{</code> と <code>}</code> の数が合っていません（開く ${o}個・閉じる ${c}個）。`);
  for(const m of body.matchAll(/\{([^{}]*)\}/g)) lintDecls(m[1],w,false);
  return w;
}
function lint(){
  const box=$('lint'); let w=[];
  try{ w=[...lintHTML(code.html).map(m=>['HTML',m]),...lintCSS(code.css).map(m=>['CSS',m])]; }catch(e){ w=[]; }
  if(!w.length){ box.hidden=true; box.innerHTML=''; return 0; }
  box.innerHTML=`<h3>コードチェック：気になるところがあります</h3><ul>${w.slice(0,4).map(([k,m])=>`<li><b>${k}</b>　${m}</li>`).join('')}</ul>${w.length>4?`<p>ほかに ${w.length-4}件あります。上から順に直してみよう。</p>`:''}<p>直したら、もう一度「反映して遊ぶ」をおそう。</p>`;
  box.hidden=false; return w.length;
}

/* ---------- 反映 ---------- */
let run={frames:0,started:false,done:false,gem:false};
function apply(fromButton){
  code[tab]=ta.value;
  save.codes[cur]={...code}; save.cur=cur; persist();
  userStyle.textContent = SCOPE_OK ? `@scope (#world) {\n${code.css}\n}` : code.css;
  layer.innerHTML=code.html;
  els.solid=[...layer.querySelectorAll('.block,.door,.wall,.ground')];
  els.trap=[...layer.querySelectorAll('.trap')];
  els.gem=[...layer.querySelectorAll('.gem')];
  els.warp=[...layer.querySelectorAll('.warp')];
  readPlayer(fromButton);
  respawn(true);
  checkTutorial();
  const warns=lint();
  if(fromButton){ vp.focus({preventScroll:true});
    if(warns) toast('コードに気になるところがあります。エディタの下を見てみよう',4000);
    else if(toastEl.hidden) toast('反映しました！ 矢印キーで動かそう'); }
}
function respawn(full){
  p.x=40; p.y=H-60-p.h; p.vx=0; p.vy=0; p.ground=true; p.coyote=0;
  els.gem.forEach(g=>g.classList.remove('got')); run.gem=false;
  if(full){ run={frames:0,started:false,done:false,gem:false}; $('clearBox').hidden=true; }
}

/* ---------- チュートリアルのチェック ---------- */
function checkTutorial(){
  if(cur!==0) return;
  const done={A:els.solid.some(e=>e.classList.contains('block')), B:prm.jump>=14, C:getComputedStyle(player).backgroundColor!==DEF.color};
  document.querySelectorAll('#mission [data-check]').forEach(li=>li.classList.toggle('done',!!done[li.dataset.check]));
}

/* ---------- 入力 ---------- */
const inp={l:false,r:false,jumpBuf:0};
const gameKey=e=>document.activeElement!==ta;
addEventListener('keydown',e=>{
  if(!gameKey(e)) return;
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'){inp.l=true;e.preventDefault();}
  else if(k==='ArrowRight'||k==='d'){inp.r=true;e.preventDefault();}
  else if(k===' '||k==='ArrowUp'||k==='w'){ if(!e.repeat) inp.jumpBuf=6; e.preventDefault(); }
  else if(k==='r'||k==='R'){ respawn(true); }
});
addEventListener('keyup',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a') inp.l=false;
  if(k==='ArrowRight'||k==='d') inp.r=false;
});
addEventListener('blur',()=>{inp.l=inp.r=false;});
function hold(btn,key){
  const on=e=>{e.preventDefault(); if(key==='j') inp.jumpBuf=6; else inp[key]=true;};
  const off=()=>{ if(key!=='j') inp[key]=false; };
  btn.addEventListener('pointerdown',on); ['pointerup','pointerleave','pointercancel'].forEach(t=>btn.addEventListener(t,off));
}
hold($('padL'),'l'); hold($('padR'),'r'); hold($('padJ'),'j');
$('retryBtn').addEventListener('click',()=>{respawn(true);vp.focus({preventScroll:true});});
vp.addEventListener('pointerdown',()=>vp.focus({preventScroll:true}));
const updHint=()=>{$('focusHint').hidden=document.activeElement===vp||run.started;};
vp.addEventListener('focus',updHint); vp.addEventListener('blur',updHint);

/* ---------- 物理 ---------- */
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
let wr, sc;
function rectOf(el){
  const r=el.getBoundingClientRect();
  if(r.width<1||r.height<1) return null;
  return {x:(r.left-wr.left)/sc,y:(r.top-wr.top)/sc,w:r.width/sc,h:r.height/sc};
}
function step(){
  if(run.done) return;
  const dir=(inp.r?1:0)-(inp.l?1:0);
  if(!run.started&&(dir||inp.jumpBuf>0)){ run.started=true; updHint(); }
  if(run.started) run.frames++;
  if(dir) p.face=dir;
  p.vx=dir*prm.speed;
  if(p.ground) p.coyote=6; else if(p.coyote>0) p.coyote--;
  if(inp.jumpBuf>0){ if(p.coyote>0){ p.vy=-prm.jump; p.coyote=0; p.ground=false; inp.jumpBuf=0; } else inp.jumpBuf--; }
  p.vy=Math.min(p.vy+G,MAXFALL);

  wr=world.getBoundingClientRect(); sc=wr.height/H||1;
  const solids=lockedRects.slice();
  for(const el of els.solid){ if(el.classList.contains('door')&&el.classList.contains('open')) continue; const r=rectOf(el); if(r) solids.push(r); }

  p.x+=p.vx;
  for(const s of solids){ if(hit(p,s)){ if(p.vx>0) p.x=s.x-p.w; else if(p.vx<0) p.x=s.x+s.w; } }
  p.x=clamp(p.x,0,st.W-p.w);
  p.y+=p.vy; p.ground=false;
  for(const s of solids){ if(hit(p,s)){ if(p.vy>0){ p.y=s.y-p.h; p.vy=0; p.ground=true; } else if(p.vy<0){ p.y=s.y+s.h; p.vy=0; } } }

  if(p.y>H+60){ toast('落ちてしまった！ スタートからやり直し'); respawn(false); failed(); return; }
  for(const el of els.trap){ const r=rectOf(el); if(r&&hit(p,{x:r.x+4,y:r.y+6,w:r.w-8,h:r.h-6})){ toast('見えないトゲにさわった！'); respawn(false); failed(); return; } }
  for(const el of els.gem){ if(el.classList.contains('got')) continue; const r=rectOf(el); if(r&&hit(p,r)){ el.classList.add('got'); run.gem=true; toast('◆ 宝石をゲット！ ゴールまで持って帰ろう'); } }
  for(const el of els.warp){ const r=rectOf(el); if(r&&hit(p,r)){ p.x=st.goal-90; p.y=H-60-p.h; p.vy=0; toast('ワープ！！ 制作者のひみつを見つけたね'); break; } }
  if(hit(p,{x:st.goal-6,y:-2000,w:24,h:2000+H-60})) finish();
}
function render(){
  player.style.transform=`translate(${p.x}px,${p.y}px)`;
  player.classList.toggle('face-left',p.face<0);
  const cam=clamp(p.x+p.w/2-VW/2,0,st.W-VW);
  world.style.transform=`translateX(${-cam}px)`;
  $('hudTime').textContent=(run.frames/60).toFixed(2)+' 秒';
  const b=save.best[cur]; $('hudBest').textContent=b!=null?`ベスト ${b.toFixed(2)} 秒`:'';
}
let acc=0,last=performance.now(),tick=0;
function loop(now){
  acc+=Math.min(now-last,100); last=now;
  while(acc>=1000/60){ step(); idleTick(); acc-=1000/60; if(++tick%30===0) readPlayer(false); }
  render(); requestAnimationFrame(loop);
}

/* ---------- クリア ---------- */
const fmt=t=>t.toFixed(2)+' 秒';
function finish(){
  run.done=true; resetHelp();
  const t=run.frames/60, prev=save.best[cur], isNew=prev==null||t<prev;
  if(isNew) save.best[cur]=t;
  if(run.gem) save.gems[cur]=true;
  persist(); renderStages();
  const last=cur===STAGES.length-1;
  $('clearTitle').textContent=last?'全ステージクリア！':'ステージクリア！';
  $('clearTime').textContent='タイム '+fmt(t);
  $('clearBest').innerHTML=isNew?'<span class="new">ベスト記録 更新！</span>':'ベスト '+fmt(prev);
  $('clearGem').textContent=save.gems[cur]?'◆ このステージの宝石：ゲット済み':'◇ このステージの宝石は、まだどこかにかくれている…';
  const total=totalBest();
  $('clearMsg').textContent=last
    ?`合計ベスト ${total} ／ 宝石 ${gemCount()}/6。次はきみが仕掛けを作る番。好きなステージに、オリジナルの足場や宝石を書き足してみよう。　© Irie Kanji`
    :cur===2?'1時間目のステージはここまで。時間があれば宝石やタイム短縮に挑戦して、ワークシート①へ進もう。'
    :'コードを工夫すると、もっとタイムを縮められるかも？';
  $('nextBtn').hidden=last;
  $('clearBox').hidden=false;
  $('nextBtn').hidden ? $('againBtn').focus() : $('nextBtn').focus();
}
$('againBtn').addEventListener('click',()=>{respawn(true);vp.focus({preventScroll:true});});
$('nextBtn').addEventListener('click',()=>loadStage(cur+1));

/* ---------- ステージ選択・合計 ---------- */
const gemCount=()=>STAGES.filter((_,i)=>save.gems[i]).length;
function totalBest(){ const v=STAGES.map((_,i)=>save.best[i]).filter(x=>x!=null); return v.length?fmt(v.reduce((a,b)=>a+b,0)):'--'; }
function renderStages(){
  $('stages').innerHTML=STAGES.map((s,i)=>{
    const b=save.best[i];
    return `${i===0?'<span class="hr">1時間目</span>':i===3?'<span class="hr">2時間目</span>':''}<button class="stg${i===cur?' on':''}${b!=null?' cleared':''}" data-i="${i}" aria-label="ステージ${i} ${s.name}">${i===0?'練習':'ST'+i}<span>${b!=null?'✓ '+b.toFixed(1)+'s':'未クリア'}${save.gems[i]?' ◆':''}</span></button>`;
  }).join('');
  $('gemTotal').textContent=gemCount();
  $('totalBest').textContent=totalBest();
}
$('stages').addEventListener('click',e=>{ const b=e.target.closest('.stg'); if(b) loadStage(+b.dataset.i); });
function loadStage(i){
  if(cur!==i){ code[tab]=ta.value; save.codes[cur]={...code}; }
  cur=i; save.cur=i;
  const s=STAGES[i], c=save.codes[i];
  code={ html:c?c.html:s.html, css:c?c.css:s.css };
  tab=s.tab; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ta.value=code[tab]; ta.scrollTop=0; renderHL();
  buildSys(); renderStages(); resetHelp(); apply(false); updHint();
}

/* ---------- 最初にもどす ---------- */
let resetArm=0;
$('resetBtn').addEventListener('click',()=>{
  const b=$('resetBtn');
  if(Date.now()-resetArm>3000){ resetArm=Date.now(); b.textContent='もう一度おすと最初にもどります'; setTimeout(()=>{b.textContent='このステージを最初にもどす';},3000); return; }
  resetArm=0; b.textContent='このステージを最初にもどす';
  const s=STAGES[cur]; code={html:s.html,css:s.css}; ta.value=code[tab]; renderHL(); apply(false); toast('ステージのコードを最初にもどしました');
});
$('applyBtn').addEventListener('click',()=>apply(true));

/* ---------- コピー ---------- */
$('mission').addEventListener('click',e=>{
  const b=e.target.closest('.copy'); if(!b) return;
  const c=b.parentElement.querySelector('code'); const text=c.textContent;
  const fallback=()=>{ const r=document.createRange(); r.selectNodeContents(c); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('選択しました。Ctrl + C でコピーしよう'); };
  try{ navigator.clipboard.writeText(text).then(()=>{b.textContent='コピーした！';setTimeout(()=>b.textContent='コピー',1500);},fallback); }catch(err){ fallback(); }
});

/* ---------- 開始 ---------- */
fit(); loadStage(cur); requestAnimationFrame(loop);
})();
</script>
</body>
